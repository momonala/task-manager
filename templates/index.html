{% extends "base.html" %}

{% block title %}Board - Task Board{% endblock %}

{% block content %}
<!-- Project Filter & Sort -->
<div class="mb-6 flex items-center gap-4 flex-wrap">
    <div class="relative flex-1 max-w-md">
        <div class="relative t-clear w-full bg-white/5 backdrop-blur-sm border border-surface-300 rounded-full">
            <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-300 z-10 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" id="projectSearch"
                   oninput="filterProjectsBySearch(this.value)"
                   class="relative z-[1] w-full bg-transparent border-0 pl-10 pr-8 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-accent-blue focus:border-transparent rounded-full">
            <div class="t-clear-mirror" aria-hidden="true"></div>
            <div class="t-clear-placeholder" aria-hidden="true">Search projects...</div>
            <div class="t-clear-glow" aria-hidden="true"></div>
            <button id="clearSearchBtn" onclick="clearProjectSearch()" type="button"
                    class="t-clear-btn hidden absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-300 hover:text-white transition-colors z-[4]">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <!-- Project checkboxes dropdown -->
        <div id="projectFilterDropdown" class="t-dropdown absolute top-full mt-2 bg-white/5 backdrop-blur-sm border border-surface-300 rounded-sm shadow-lg z-50 w-full max-h-[300px] overflow-y-auto">
            <div class="p-2">
                <div class="flex gap-2 mb-2 pb-2 border-b border-surface-300">
                    <button onclick="selectAllProjects()"
                            class="flex-1 text-xs text-accent-blue hover:text-blue-400 font-medium px-2 py-1 rounded-full hover:bg-surface-200 transition-colors">
                        Select All
                    </button>
                    <button onclick="selectNoneProjects()"
                            class="flex-1 text-xs text-white font-medium px-2 py-1 rounded-full hover:bg-surface-200 transition-colors">
                        Select None
                    </button>
                </div>
                <div id="projectCheckboxes" class="space-y-1">
                    {% include "_project_filter_items.html" %}
                </div>
            </div>
        </div>
    </div>

    <select id="sortSelect" onchange="sortTickets()"
            class="bg-white/5 backdrop-blur-sm border border-surface-300 rounded-full pl-5 pr-8 py-1.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-accent-blue hover:bg-white/10 transition-colors">
        <option value="date-desc">Date (Newest First)</option>
        <option value="date-asc">Date (Oldest First)</option>
        <option value="project-asc">Project (A-Z)</option>
        <option value="project-desc">Project (Z-A)</option>
    </select>
</div>

<div id="boardRegion">
    {% include "_board.html" %}
</div>
{% endblock %}
